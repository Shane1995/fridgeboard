services:
  localstack:
    image: localstack/localstack-pro:2026.10.4@sha256:2290500d7398e6458544fab2f49aaf170b81a1006ee69067e8e7fc59b810a824
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?run export LOCALSTACK_AUTH_TOKEN first}
      SERVICES: dynamodb,sqs,ssm,s3,events
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
