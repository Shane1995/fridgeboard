name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Flip every live alias back to its previous version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the repo changed, so only those are checked and deployed.
  #   config  apps/configuration           -> validate and lint the JSON, deploy the config
  #   web     apps/web                     -> check and deploy the web app
  #   api     apps/functions, e2e          -> check and deploy the Lambdas
  # Shared code (contract, lockfile, root tooling) checks and deploys both apps. A change to the
  # workflow itself checks everything and deploys nothing.
  scope:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.diff.outputs.web }}
      api: ${{ steps.diff.outputs.api }}
      config: ${{ steps.diff.outputs.config }}
      deploy_web: ${{ steps.diff.outputs.deploy_web }}
      deploy_api: ${{ steps.diff.outputs.deploy_api }}
      deploy_config: ${{ steps.diff.outputs.deploy_config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(printf '%s\n' packages/force apps/web/force apps/functions/force apps/configuration/force)
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          has() { if grep -qE "$1" <<< "$files"; then echo true; else echo false; fi; }
          any() { for value in "$@"; do if [ "$value" = true ]; then echo true; return; fi; done; echo false; }
          shared=$(has '^(packages/|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig|\.oxlintrc\.json$|\.oxfmtrc\.json$|\.fallowrc\.json$|vitest\.config|scripts/|commitlint)')
          tooling=$(has '^(\.github/|compose\.yaml$)')
          web_code=$(has '^apps/web/')
          api_code=$(has '^apps/functions/')
          e2e=$(has '^e2e/')
          config=$(has '^apps/configuration/')
          {
            echo "web=$(any "$shared" "$tooling" "$web_code")"
            echo "api=$(any "$shared" "$tooling" "$api_code" "$e2e")"
            echo "config=$(any "$shared" "$tooling" "$config")"
            echo "deploy_web=$(any "$shared" "$web_code")"
            echo "deploy_api=$(any "$shared" "$api_code")"
            echo "deploy_config=$config"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  check-config:
    needs: scope
    if: needs.scope.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run format:check lint --filter=@fridgeboard/configuration
      - run: pnpm --filter @fridgeboard/configuration validate

  check-web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/checkReexports/index.ts
      - run: pnpm turbo run format:check lint typecheck test build --filter=@fridgeboard/web...
      - run: pnpm exec vitest run
      - run: pnpm --filter @fridgeboard/configuration validate
      - run: npx fallow@2.89.0 dead-code --production --fail-on-issues
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  check-api:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:8000"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/checkReexports/index.ts
      - run: pnpm turbo run format:check lint typecheck test build --filter=@fridgeboard/functions... --filter=@fridgeboard/e2e
      - run: pnpm exec vitest run
      - run: pnpm --filter @fridgeboard/e2e test:integration
      - run: pnpm --filter @fridgeboard/configuration validate
      - run: pnpm --filter @fridgeboard/functions smoke
      - run: npx fallow@2.89.0 dead-code --production --fail-on-issues
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-dist
          path: apps/functions/dist
          retention-days: 7

  # The one required status check. It passes when every check that was needed passed; a check that
  # was not needed counts as passing.
  checks:
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [scope, check-config, check-web, check-api]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.scope.result == "success"' > /dev/null
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.deploy_api == 'true'
    needs: [scope, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fridgeboard.uk
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-dist
          path: api-dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy API Lambdas
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/flipped"
          specs=()
          for bundle in api-dist/*/index.mjs; do
            dir=$(basename "$(dirname "$bundle")")
            name=$(sed -E 's/([a-z0-9])([A-Z])/\1-\2/g' <<< "$dir" | tr '[:upper:]' '[:lower:]')
            case "$dir" in
              preSignUp) kind=pre-sign-up ;;
              postConfirmation) kind=post-confirmation ;;
              subscribeGuard) kind=subscribe-guard ;;
              *) kind=wrapped ;;
            esac
            specs+=("$dir:fridgeboard-$name:$kind")
          done
          for spec in "${specs[@]}"; do
            IFS=: read -r dir fn kind <<< "$spec"
            aws lambda get-function-configuration --function-name "$fn" > /dev/null || {
              echo "built $dir has no deployed function $fn: add it in Terraform first"
              exit 1
            }
          done
          for spec in "${specs[@]}"; do
            IFS=: read -r dir fn kind <<< "$spec"
            zip -j "$RUNNER_TEMP/$dir.zip" "api-dist/$dir/index.mjs"
            aws lambda update-function-code --function-name "$fn" --zip-file "fileb://$RUNNER_TEMP/$dir.zip" > /dev/null
            aws lambda wait function-updated --function-name "$fn"
            new=$(aws lambda publish-version --function-name "$fn" --query Version --output text)
            .github/scripts/smoke-version.sh "$fn" "$new" "$kind"
            prev=$(aws lambda get-alias --function-name "$fn" --name live --query FunctionVersion --output text)
            aws lambda update-alias --function-name "$fn" --name live --function-version "$new" --description "prev=$prev" > /dev/null
            echo "$fn $prev" >> "$RUNNER_TEMP/flipped"
          done
      - name: Smoke check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://app.fridgeboard.uk/api/v1/me || true)
            case "$out" in "401 application/json"*) exit 0 ;; esac
            sleep 5
          done
          echo "unexpected /api/v1/me response: $out"
          exit 1
      - name: Roll back aliases
        if: failure()
        run: |
          while read -r fn prev; do
            aws lambda update-alias --function-name "$fn" --name live --function-version "$prev" --description "prev=$prev" > /dev/null
          done < "$RUNNER_TEMP/flipped"

  deploy-web:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.scope.outputs.deploy_web == 'true' && needs.checks.result == 'success'
      && needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
    needs: [scope, checks, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fridgeboard.uk
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Upload hashed assets (cached for a year)
        run: aws s3 sync dist/assets "s3://$BUCKET/webapp/assets" --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (always revalidated)
        run: aws s3 sync dist "s3://$BUCKET/webapp" --exclude "assets/*" --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
      - name: Smoke check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://app.fridgeboard.uk/ || true)
            case "$out" in "200 text/html"*) exit 0 ;; esac
            sleep 5
          done
          echo "unexpected / response: $out"
          exit 1

  config-lambda:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.scope.outputs.deploy_config == 'true' && needs.checks.result == 'success'
      && needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
      && needs.deploy-web.result != 'failure' && needs.deploy-web.result != 'cancelled'
    needs: [scope, checks, deploy-api, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-config
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/configuration
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CONFIG_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Compare with the deployed lambda configuration
        id: compare
        run: |
          if aws s3 cp "s3://$BUCKET/configuration/lambda/configuration.json" "$RUNNER_TEMP/live.json" --quiet 2>/dev/null \
            && cmp -s "$RUNNER_TEMP/live.json" apps/configuration/lambda/configuration.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload lambda configuration
        if: steps.compare.outputs.changed == 'true'
        run: |
          aws s3 cp apps/configuration/lambda/configuration.json "s3://$BUCKET/configuration/lambda/configuration.json" \
            --content-type application/json --cache-control "private,max-age=60"
          aws s3api head-object --bucket "$BUCKET" --key configuration/lambda/configuration.json > /dev/null

  config-web:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.scope.outputs.deploy_config == 'true' && needs.checks.result == 'success'
      && needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
      && needs.deploy-web.result != 'failure' && needs.deploy-web.result != 'cancelled'
      && needs.config-lambda.result != 'failure' && needs.config-lambda.result != 'cancelled'
    needs: [scope, checks, deploy-api, deploy-web, config-lambda]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-config
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/configuration
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CONFIG_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Compare with the deployed web configuration
        id: compare
        run: |
          if aws s3 cp "s3://$BUCKET/configuration/web/configuration.json" "$RUNNER_TEMP/live.json" --quiet 2>/dev/null \
            && cmp -s "$RUNNER_TEMP/live.json" apps/configuration/web/configuration.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload web configuration
        if: steps.compare.outputs.changed == 'true'
        run: |
          aws s3 cp apps/configuration/web/configuration.json "s3://$BUCKET/configuration/web/configuration.json" \
            --content-type application/json --cache-control "public,max-age=60"
      - name: Invalidate CloudFront
        if: steps.compare.outputs.changed == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/configuration.json" > /dev/null
      - name: Smoke check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://app.fridgeboard.uk/configuration.json || true)
            case "$out" in "200 application/json"*) exit 0 ;; esac
            sleep 10
          done
          echo "unexpected /configuration.json response: $out"
          exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Flip aliases to previous versions
        run: |
          set -euo pipefail
          for fn in fridgeboard-auth fridgeboard-me fridgeboard-pre-sign-up fridgeboard-post-confirmation; do
            read -r cur desc < <(aws lambda get-alias --function-name "$fn" --name live --query '[FunctionVersion,Description]' --output text)
            prev="${desc#prev=}"
            [[ "$prev" =~ ^[0-9]+$ ]] || { echo "$fn: no previous version recorded"; exit 1; }
            aws lambda update-alias --function-name "$fn" --name live --function-version "$prev" --description "prev=$cur" > /dev/null
            echo "$fn: $cur -> $prev"
          done

  fallow-report:
    needs: scope
    if: github.event_name == 'pull_request' && (needs.scope.outputs.web == 'true' || needs.scope.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate report
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo '<!-- fallow-id: fallow-results -->'
            npx fallow@2.89.0 audit --base "$BASE" --production-dead-code --format pr-comment-github --quiet | grep -v 'fallow-id' || true
            npx fallow@2.89.0 health --format pr-comment-github --quiet | grep -v 'fallow-id' || true
          } > fallow.md
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- fallow-id: fallow-results -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@fallow.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file fallow.md
          fi
