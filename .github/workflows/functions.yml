name: Functions

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of the API package names to check
        type: string
        default: '[]'
      lambdas:
        description: JSON array of {path, package, fn, kind} for the Lambdas to deploy
        type: string
        default: '[]'
      deploy:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:8000"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/checkReexports/index.ts
      - run: node scripts/checkDeployments/index.ts
      - name: Check affected packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          filters=$(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES")
          pnpm turbo run format:check lint typecheck test build $filters
      - run: pnpm exec vitest run
      - run: pnpm --filter @fridgeboard/e2e test:integration
      - run: pnpm --filter @fridgeboard/configuration validate
      - name: Smoke affected bundles
        env:
          LAMBDAS: ${{ inputs.lambdas }}
        run: |
          filters=$(jq -r '.[] | "--filter=" + .package' <<< "$LAMBDAS")
          if [ -n "$filters" ]; then pnpm turbo run smoke $filters; fi
      - run: npx fallow@2.89.0 dead-code --production --fail-on-issues
      - name: Stage bundles
        if: inputs.deploy
        env:
          LAMBDAS: ${{ inputs.lambdas }}
        run: |
          jq -r '.[].path' <<< "$LAMBDAS" | while read -r path; do
            mkdir -p "api-dist/$(basename "$path")"
            cp "$path/dist/index.mjs" "api-dist/$(basename "$path")/index.mjs"
          done
      - if: inputs.deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-dist
          path: api-dist
          retention-days: 7

  deploy:
    if: inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fridgeboard.uk
    concurrency:
      group: deploy-functions
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-dist
          path: api-dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy API Lambdas
        env:
          LAMBDAS: ${{ inputs.lambdas }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/flipped"
          specs=()
          while IFS=$'\t' read -r path fn kind; do
            specs+=("$(basename "$path"):$fn:$kind")
          done < <(jq -r '.[] | [.path, .fn, .kind] | @tsv' <<< "$LAMBDAS")
          for spec in "${specs[@]}"; do
            IFS=: read -r dir fn kind <<< "$spec"
            aws lambda get-function-configuration --function-name "$fn" > /dev/null || {
              echo "built $dir has no deployed function $fn: add it in Terraform first"
              exit 1
            }
          done
          deploy_one() {
            local dir="$1" fn="$2" kind="$3"
            local sha prev live
            sha="sha256:$(sha256sum "api-dist/$dir/index.mjs" | cut -d' ' -f1)"
            prev=$(aws lambda get-alias --function-name "$fn" --name live --query FunctionVersion --output text)
            live=$(aws lambda get-function-configuration --function-name "$fn" --qualifier "$prev" --query Description --output text 2>/dev/null || true)
            if [ "$live" = "$sha" ]; then
              echo "$fn v$prev already runs this bundle: nothing to deploy"
              return 0
            fi
            zip -j "$RUNNER_TEMP/$dir.zip" "api-dist/$dir/index.mjs"
            aws lambda update-function-code --function-name "$fn" --zip-file "fileb://$RUNNER_TEMP/$dir.zip" > /dev/null
            aws lambda wait function-updated --function-name "$fn"
            local new
            new=$(aws lambda publish-version --function-name "$fn" --description "$sha" --query Version --output text)
            .github/scripts/smoke-version.sh "$fn" "$new" "$kind"
            aws lambda update-alias --function-name "$fn" --name live --function-version "$new" --description "prev=$prev" > /dev/null
            echo "$fn $prev" >> "$RUNNER_TEMP/flipped"
          }
          pids=()
          for spec in "${specs[@]}"; do
            IFS=: read -r dir fn kind <<< "$spec"
            deploy_one "$dir" "$fn" "$kind" > "$RUNNER_TEMP/$dir.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            IFS=: read -r dir fn kind <<< "${specs[$i]}"
            wait "${pids[$i]}" || failed=1
            echo "::group::$fn"
            cat "$RUNNER_TEMP/$dir.log"
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Smoke check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://app.fridgeboard.uk/api/v1/me || true)
            case "$out" in "401 application/json"*) exit 0 ;; esac
            sleep 5
          done
          echo "unexpected /api/v1/me response: $out"
          exit 1
      - name: Roll back aliases
        if: failure()
        run: |
          while read -r fn prev; do
            aws lambda update-alias --function-name "$fn" --name live --function-version "$prev" --description "prev=$prev" > /dev/null
          done < "$RUNNER_TEMP/flipped"
