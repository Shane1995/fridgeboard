name: Web

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/checkReexports/index.ts
      - run: pnpm turbo run format:check lint typecheck test build --filter=@fridgeboard/web...
      - run: pnpm exec vitest run
      - run: pnpm --filter @fridgeboard/configuration validate
      - run: npx fallow@2.89.0 dead-code --production --fail-on-issues
      - if: inputs.deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    if: inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fridgeboard.uk
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Upload hashed assets (cached for a year)
        run: aws s3 sync dist/assets "s3://$BUCKET/webapp/assets" --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (always revalidated)
        run: aws s3 sync dist "s3://$BUCKET/webapp" --exclude "assets/*" --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
      - name: Smoke check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://app.fridgeboard.uk/ || true)
            case "$out" in "200 text/html"*) exit 0 ;; esac
            sleep 5
          done
          echo "unexpected / response: $out"
          exit 1
